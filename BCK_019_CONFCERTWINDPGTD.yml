---
- hosts: "{{ HOST }}"
  gather_facts: no
  tasks:
  - name: Nombre Host
    win_command: cmd.exe /c hostname
    register: hostname
  - debug:
      msg: "HOSTNAME: {{ hostname.stdout }}"
        
  - name: Configurar Certificado Data Protector MEG Cell Manager
    win_command: cmd.exe /c omnicc -secure_comm -configure_exception prdavwpdpap.previsora.col -overwrite -accept_host
    register: certmeg
  - debug: var=certmeg.stdout_lines

  - name: Configurar Certificado Data Protector MEG Media Agent
    win_command: cmd.exe /c omnicc -secure_comm -configure_exception prdafwpmagtd.previsora.col -overwrite -accept_host
    register: certmameg
  - debug: var=certmameg.stdout_lines
