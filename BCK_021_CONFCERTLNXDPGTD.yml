---
- hosts: "{{ HOST }}"
  tasks:
  - name: Nombre Host
    command: hostname
    register: hostname
  - debug:
      msg: "HOSTNAME: {{ hostname.stdout }}"
      
  - name: Configurar Certificado Data Protector Cell Manager
    command: /opt/omni/bin/omnicc -secure_comm -configure_exception prdavwpdpap.previsora.col -overwrite -accept_host
    register: certmeg
  - debug: var=certmeg.stdout_lines

  - name: Configurar Certificado Data Protector Media Agent
    command: /opt/omni/bin/omnicc -secure_comm -configure_exception prdafwpmagtd.previsora.col -overwrite -accept_host
    register: certmameg
  - debug: var=certmameg.stdout_lines
