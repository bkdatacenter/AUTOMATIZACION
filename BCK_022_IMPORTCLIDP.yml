---
- hosts: all
  gather_facts: no
  tasks:
  - name: Nombre Host
    win_command: cmd.exe /c hostname
    register: hostname
  - debug:
      msg: "HOSTNAME: {{ hostname.stdout }}"

  - name: Configurar excepción certificado
    win_command: cmd.exe /c omnicc -secure_comm -configure_exception "{{ CLIENTE }}" -overwrite
    register: exceptdp
  - debug: var=exceptdp.stdout_lines
        
  - name: Importar Cliente de Data Protector
    win_command: cmd.exe /c omnicc -import_host "{{ CLIENTE }}" -accept_host
    register: importdp
  - debug: var=importdp.stdout_lines
